<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام‌رسان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- پس‌زمینه متحرک -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- ===== صفحه ورود ===== -->
<div id="login" class="login-overlay">
  <div class="login-card">
    <div class="logo-big">💬</div>
    <h1>پیام‌رسان</h1>
    <p class="sub">نام خود را وارد کنید و شروع کنید</p>
    <input id="nameInput" type="text" placeholder="نام شما..." maxlength="24" autocomplete="off">
    <button id="joinBtn" class="primary-btn">ورود به چت</button>
    <p class="hint">با زدن دکمه، شما وارد چت عمومی می‌شوید</p>
  </div>
</div>

<!-- ===== برنامه اصلی ===== -->
<div id="app" class="app hidden">

  <!-- سایدبار -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="brand-icon">💬</span> پیام‌رسان</div>
      <button class="icon-btn close-side" id="closeSide">✕</button>
    </div>

    <div class="me-card">
      <div class="avatar" id="myAvatar">?</div>
      <div class="me-info">
        <div class="me-name" id="myName">—</div>
        <div class="me-status"><span class="dot"></span> آنلاین</div>
      </div>
    </div>

    <div class="users-title">
      <span>کاربران آنلاین</span>
      <span class="badge" id="userCount">0</span>
    </div>
    <ul id="userList" class="user-list"></ul>
  </aside>

  <!-- چت -->
  <main class="chat">
    <header class="chat-header">
      <button class="icon-btn menu-btn" id="openSide">☰</button>
      <div class="chat-title">
        <h2>چت عمومی</h2>
        <span class="status"><span class="dot"></span> <span id="headerCount">0</span> نفر آنلاین</span>
      </div>
      <div class="header-actions">
        <span class="live-badge">🟢 زنده</span>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <!-- نوار پیام -->
    <div class="composer">
      <div class="composer-main" id="composerMain">
        <button class="icon-btn" id="attachBtn" title="ارسال فایل">📎</button>
        <input type="file" id="fileInput" hidden>
        <div class="input-wrap">
          <textarea id="msgInput" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
        </div>
        <button class="icon-btn mic" id="micBtn" title="ضبط پیام صوتی">🎤</button>
        <button class="send-btn" id="sendBtn" title="ارسال">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>

      <div class="composer-rec hidden" id="composerRec">
        <span class="rec-dot"></span>
        <span id="recTime">00:00</span>
        <div class="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn danger" id="cancelRec" title="لغو">🗑️</button>
        <button class="send-btn" id="sendRec" title="ارسال">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- ===== مودال تماس ورودی ===== -->
<div id="callModal" class="call-modal hidden">
  <div class="call-card">
    <div class="pulse-ring"></div>
    <div class="caller-avatar" id="callAvatar">A</div>
    <h3 id="callName">—</h3>
    <p id="callStatus">در حال تماس...</p>
    <div class="call-actions">
      <button id="acceptCall" class="round-btn accept" title="پاسخ">📞</button>
      <button id="rejectCall" class="round-btn reject" title="رد">✕</button>
    </div>
  </div>
</div>

<!-- ===== مودال تماس فعال ===== -->
<div id="activeCall" class="call-modal hidden">
  <div class="call-card active">
    <div class="caller-avatar big" id="activeAvatar">A</div>
    <h3 id="activeName">—</h3>
    <p id="activeStatus">00:00</p>
    <div class="call-actions">
      <button id="muteBtn" class="round-btn mute" title="بی‌صدا">🎙️</button>
      <button id="endCallBtn" class="round-btn reject" title="پایان">📵</button>
    </div>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<!-- توست -->
<div id="toast" class="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
